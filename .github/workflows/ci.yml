name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-build:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code Quality
        run: npm run lint

      - name: TypeCheck TypeScript
        run: npx tsc --noEmit

      - name: Build Production Bundle
        run: npm run build

  container-security-build:
    name: Multi-Stage Container Build & Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Hardened Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: pooltech-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pooltech-web:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
